---
- name: ensure /etc/modules-load.d exists
  shell: |
    mkdir -p /etc/modules-load.d
  args:
    executable: /bin/bash

- name: ensure python-libdnf5 installed
  shell: |
    dnf install -y python-libdnf5
  args:
    executable: /bin/bash

- name: Configure systemd-resolved for legacy DNS
  include_tasks: utils/configure_systemd_resolved.yml

- name: Include RedHat General Repo Init
  include_tasks: redhat-general-repo.yml

- name: Include RedHat Family Common Tasks
  include_tasks: redhat.yml
